<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shubham's Calculator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #e8eef8;
    font-family: Arial, sans-serif;
}

.calculator {
    width: 320px;
    padding: 22px;
    background: #172554;
    border-radius: 18px;
    box-shadow: 0 8px 25px #0002;
}

h2 {
    color: white;
    text-align: center;
}

#display {
    width: 100%;
    height: 65px;
    margin-bottom: 15px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: white;
    font-size: 25px;
    text-align: right;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 9px;
}

button {
    height: 52px;
    border: none;
    border-radius: 8px;
    font-size: 19px;
    cursor: pointer;
    background: #35466c;
    color: white;
}

button:hover {
    opacity: 0.8;
}

.operator {
    background: #6546e8;
}

.clear {
    background: #dc4055;
}

.equal {
    background: #15966b;
    grid-column: span 2;
}
</style>
</head>

<body>

<div class="calculator">
    <h2>My Calculator</h2>

    <input id="display" value="0" readonly>

    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">AC</button>
        <button onclick="backspace()">DEL</button>
        <button class="operator" onclick="chooseOperator('%')">%</button>
        <button class="operator" onclick="chooseOperator('/')">÷</button>

        <button onclick="appendNumber('7')">7</button>
        <button onclick="appendNumber('8')">8</button>
        <button onclick="appendNumber('9')">9</button>
        <button class="operator" onclick="chooseOperator('*')">×</button>

        <button onclick="appendNumber('4')">4</button>
        <button onclick="appendNumber('5')">5</button>
        <button onclick="appendNumber('6')">6</button>
        <button class="operator" onclick="chooseOperator('-')">−</button>

        <button onclick="appendNumber('1')">1</button>
        <button onclick="appendNumber('2')">2</button>
        <button onclick="appendNumber('3')">3</button>
        <button class="operator" onclick="chooseOperator('+')">+</button>

        <button onclick="appendNumber('0')">0</button>
        <button onclick="appendNumber('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
const display = document.getElementById("display");
let firstNumber = null;
let operator = null;
let startNewNumber = true;

function appendNumber(number) {
    if (startNewNumber) {
        display.value = number === "." ? "0." : number;
        startNewNumber = false;
        return;
    }

    if (number === "." && display.value.includes(".")) return;

    if (display.value === "0" && number !== ".") {
        display.value = number;
    } else {
        display.value += number;
    }
}

function chooseOperator(op) {
    firstNumber = Number(display.value);
    operator = op;
    startNewNumber = true;
}

function calculate() {
    if (operator === null || startNewNumber) return;

    const secondNumber = Number(display.value);
    let result;

    switch (operator) {
        case "+":
            result = firstNumber + secondNumber;
            break;
        case "-":
            result = firstNumber - secondNumber;
            break;
        case "*":
            result = firstNumber * secondNumber;
            break;
        case "/":
            if (secondNumber === 0) {
                display.value = "Cannot divide by zero";
                operator = null;
                startNewNumber = true;
                return;
            }
            result = firstNumber / secondNumber;
            break;
        case "%":
            result = firstNumber % secondNumber;
            break;
    }

    display.value = String(Number(result.toPrecision(10)));
    operator = null;
    startNewNumber = true;
}

function clearDisplay() {
    display.value = "0";
    firstNumber = null;
    operator = null;
    startNewNumber = true;
}

function backspace() {
    if (startNewNumber) return;

    display.value = display.value.length > 1
        ? display.value.slice(0, -1)
        : "0";
}
</script>

</body>
</html>
